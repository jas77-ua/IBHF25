<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="src/assets/favicon.ico">
    <title>Sabadell NEXT</title>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body>
    <div class="pantalla">
        <!-- Barra de estado -->
        <div class="barra-estado">
            <div class="hora-actual" id="hora-actual">14:30</div>
            <div class="iconos-estado">
                <i class="fi fi-rr-signal-alt"></i>
                <i class="fi fi-rr-wifi"></i>
                <i class="fi fi-rr-battery-full"></i>
            </div>
        </div>

        <!-- Contenido de la App -->
        <div class="contenido-app">
            <!-- Encabezado -->
            <div class="encabezado-app">
                <div class="info-usuario">
                    <div>
                        <div class="texto-bienvenida">¡Hola, Alex! <i class="fi fi-rr-hand-wave"></i></div>
                        <div class="cantidad-saldo" id="saldo">€127.80</div>
                    </div>
                    <div class="meta-ahorro">
                        <div class="texto-meta">Meta ahorro</div>
                        <div class="cantidad-meta">€200</div>
                    </div>
                </div>
                <div class="progreso-ahorro">
                    <div class="texto-progreso">Progreso: <span id="texto-progreso">65%</span></div>
                    <div class="barra-progreso">
                        <div class="relleno-progreso" id="relleno-progreso"></div>
                    </div>
                </div>
            </div>

            <!-- Misiones -->
            <div class="seccion">
                <div class="titulo-seccion"><i class="fi fi-rr-target"></i> Misiones Activas</div>
                <div class="cuadricula-misiones" id="contenedor-misiones">
                    <!-- Las misiones se cargan con JavaScript -->
                </div>
            </div>

            <!-- Transacciones -->
            <div class="seccion">
                <div class="titulo-seccion"><i class="fi fi-rr-chart-histogram"></i> Últimas Transacciones</div>
                <div class="lista-transacciones" id="contenedor-transacciones">
                    <!-- Las transacciones se cargan con JavaScript -->
                </div>
            </div>
        </div>

        <!-- Navegación Inferior -->
        <div class="navegacion-inferior">
            <div class="elemento-nav activo" data-pagina="inicio">
                <div class="icono-nav"><i class="fi fi-rr-home"></i></div>
                <div>Inicio</div>
            </div>
            <div class="elemento-nav" data-pagina="misiones">
                <div class="icono-nav"><i class="fi fi-rr-gamepad"></i></div>
                <div>Misiones</div>
            </div>
            <div class="elemento-nav" data-pagina="estadisticas">
                <div class="icono-nav"><i class="fi fi-rr-chart-histogram"></i></div>
                <div>Estadísticas</div>
            </div>
            <div class="elemento-nav" data-pagina="perfil">
                <div class="icono-nav"><i class="fi fi-rr-user"></i></div>
                <div>Perfil</div>
            </div>
        </div>
    </div>

    <!-- CONTROLES EXTERNOS (solo visible en desktop) -->
    <div class="controles-externos">
        <h3><i class="fi fi-rr-settings"></i> Demo</h3>
        <div class="botones-control">
            <button class="boton-control" id="añadir-dinero"><i class="fi fi-rr-plus"></i> Recibir €20</button>
            <button class="boton-control" id="gastar-dinero"><i class="fi fi-rr-minus"></i> Gastar €15</button>
            <button class="boton-control" id="completar-mision"><i class="fi fi-rr-check"></i> Completar</button>
            <button class="boton-control" id="reiniciar-demo"><i class="fi fi-rr-refresh"></i> Reiniciar</button>
        </div>
    </div>

    <script type="module" src="src/js/main.js"></script>
</body>
</html>
