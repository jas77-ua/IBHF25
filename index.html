<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="src/assets/favicon.ico">
    <title>Sabadell NEXT - Demo App</title>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body>
    <div class="pantalla">
        <!-- Contenido de la App -->
        <div class="contenido-app">
            <!-- Encabezado -->
            <div class="encabezado-app">
                <div class="info-usuario">
                    <div>
                        <div class="texto-bienvenida">¡Hola, Alex! <i class="fi fi-rr-hand-wave"></i></div>
                        <div class="cantidad-saldo" id="saldo">€127.80</div>
                    </div>
                    <div class="meta-ahorro">
                        <div class="texto-meta">Meta ahorro</div>
                        <div class="cantidad-meta">€200</div>
                    </div>
                </div>
                <div class="progreso-ahorro">
                    <div class="texto-progreso">Progreso: <span id="texto-progreso">65%</span></div>
                    <div class="barra-progreso">
                        <div class="relleno-progreso" id="relleno-progreso"></div>
                    </div>
                </div>
            </div>

            <!-- Banner de Tarjeta -->
            <div class="banner-tarjeta" id="banner-tarjeta">
                <div class="info-tarjeta">
                    <div class="icono-tarjeta">💳</div>
                    <div class="detalles-tarjeta">
                        <div class="nombre-tarjeta" id="nombre-tarjeta">—</div>
                        <div class="termina-en" id="termina-en">Termina en ****</div>
                    </div>
                </div>
            </div>

            <!-- Sección de Tarjetas (oculta al inicio) -->
            <div class="seccion-tarjetas" id="seccion-tarjetas" style="display: none;">
                <div class="encabezado-seccion">
                    <button class="boton-volver" id="boton-volver-tarjetas">←</button>
                    <h2 class="titulo-seccion-tarjetas">Mis Tarjetas</h2>
                </div>

                <div class="tarjeta-detalle">
                    <div class="tarjeta-bancaria">
                        <div class="tarjeta-logo">Visa</div>
                        <div class="tarjeta-numero">**** **** **** <span id="ultimos-digitos-tarjeta">4321</span></div>
                        <div class="tarjeta-info">
                            <div class="tarjeta-titular">ALEX MARTÍNEZ</div>
                            <div class="tarjeta-vencimiento">Vence: <span>12/27</span></div>
                        </div>
                        <div class="tarjeta-chip"></div>
                    </div>

                    <div class="acciones-tarjeta">
                        <button class="boton-accion" id="bloquear-tarjeta">🔒 Bloquear Tarjeta</button>
                        <button class="boton-accion" id="desbloquear-tarjeta" style="display: none;">🔓 Desbloquear Tarjeta</button>
                        <button class="boton-accion" id="historial-tarjeta">📊 Ver Historial</button>
                        <button class="boton-accion" id="limites-tarjeta">📈 Límites y Pagos</button>
                    </div>
                </div>
            </div>

            <!-- Historial de tarjeta (oculto por defecto) -->
            <div class="historial-tarjeta" id="historial-tarjeta-contenedor" style="display: none; margin-top: 24px;">
                <h3 class="titulo-historial">Historial de la Tarjeta</h3>
                <div class="lista-historial" id="lista-historial-tarjeta">
                    <!-- Las transacciones se cargarán aquí -->
                </div>
                <button class="boton-volver-historial" id="boton-volver-historial">← Volver a Tarjeta</button>
            </div>

            <!-- Misiones -->
            <div class="seccion">
                <div class="titulo-seccion"><i class="fi fi-rr-target"></i> Misiones Activas</div>
                <div class="cuadricula-misiones" id="contenedor-misiones">
                    <!-- Las misiones se cargan con JavaScript -->
                </div>
            </div>

            <!-- Transacciones -->
            <div class="seccion">
                <div class="titulo-seccion"><i class="fi fi-rr-chart-histogram"></i> Últimas Transacciones</div>
                <div class="lista-transacciones" id="contenedor-transacciones">
                    <!-- Las transacciones se cargan con JavaScript -->
                </div>
            </div>
        </div>

        <!-- Navegación Inferior -->
        <div class="navegacion-inferior">
            <div class="elemento-nav activo" data-pagina="inicio">
                <div class="icono-nav"><i class="fi fi-rr-home"></i></div>
                <div>Inicio</div>
            </div>
            <div class="elemento-nav" data-pagina="misiones">
                <div class="icono-nav"><i class="fi fi-rr-gamepad"></i></div>
                <div>Misiones</div>
            </div>
            <div class="elemento-nav" data-pagina="estadisticas">
                <div class="icono-nav"><i class="fi fi-rr-chart-histogram"></i></div>
                <div>Estadísticas</div>
            </div>
            <div class="elemento-nav" data-pagina="perfil">
                <div class="icono-nav"><i class="fi fi-rr-user"></i></div>
                <div>Perfil</div>
            </div>
        </div>
    </div>

    <script type="module" src="src/js/main.js"></script>
</body>
</html>
